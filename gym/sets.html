<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sets Timer</title>
<style>
:root{--bg:#0E1116;--panel:#181D25;--btn:#262D38;--dim:#8A94A3;--green:#3DDC84;--amber:#FFB300;--blue:#4FC3F7;--accent:#3DDC84}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
.screen{display:none;min-height:100%;max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));flex-direction:column;gap:14px}
.screen.on{display:flex}
.screen.center{justify-content:space-between;align-items:center;text-align:center}
h1{margin:0;font-size:44px;font-weight:900;color:var(--green);letter-spacing:1px}
.sub{color:var(--dim);margin:-8px 0 8px}
.back{color:var(--dim);text-decoration:none;font-size:15px}
.row{display:flex;align-items:center;gap:8px}
.step{background:var(--panel);border-radius:18px;padding:12px 16px}
.step span.l{flex:1;color:var(--dim);font-size:17px}
.step b{width:92px;text-align:center;font-size:28px}
.rb{width:48px;height:48px;border-radius:50%;border:0;background:var(--btn);color:#fff;font-size:26px}
.vbtn{width:auto;padding:0 20px;border-radius:24px;font-size:16px;font-weight:700}
.total{text-align:center;color:var(--dim);font-size:16px}
.big{height:72px;border:0;border-radius:20px;background:var(--green);color:var(--bg);font-size:24px;font-weight:700;width:100%}
.btn{flex:1;height:64px;border-radius:18px;border:1px solid #3a4452;background:none;color:#fff;font-size:18px}
.btn.main{flex:1.4;border:0;background:var(--accent);color:var(--bg);font-weight:700}
.lbl{font-size:24px;font-weight:700;color:var(--accent)}
.name{color:var(--dim);font-size:18px;min-height:22px}
.ring{position:relative;width:min(85vw,420px,48vh);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
#bar{stroke:var(--accent);stroke-linecap:round;transition:stroke .2s}
.num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(64px,24vw,120px);font-weight:900;font-variant-numeric:tabular-nums}
.dim{color:var(--dim);font-size:18px}
.w100{width:100%}
.ctl{display:flex;flex-direction:column;gap:10px;width:100%}
.clock{font-size:clamp(64px,22vw,110px);font-weight:900;font-variant-numeric:tabular-nums;color:var(--green);text-align:center;margin:30px 0 0}
</style>
</head>
<body>

<!-- SETUP -->
<div id="s" class="screen on">
  <a class="back" href="index.html">← Menu</a>
  <h1>SETS</h1>
  <p class="sub">Set time and rest, set after set</p>
  <div class="row step"><span class="l">Sets</span><button class="rb" data-k="sets" data-d="-1">−</button><b id="v-sets"></b><button class="rb" data-k="sets" data-d="1">+</button></div>
  <div class="row step"><span class="l">Set duration</span><button class="rb" data-k="dur" data-d="-1">−</button><b id="v-dur"></b><button class="rb" data-k="dur" data-d="1">+</button></div>
  <div class="row step"><span class="l">Rest</span><button class="rb" data-k="rest" data-d="-1">−</button><b id="v-rest"></b><button class="rb" data-k="rest" data-d="1">+</button></div>
  <div class="row step"><span class="l">Voice</span><button class="rb vbtn" id="voice"></button></div>
  <div class="total" id="total"></div>
  <button class="big" id="start">START</button>
  <button class="btn w100" id="seeRecap" style="flex:none;display:none">VIEW RECAP</button>
</div>

<!-- TIMER (get ready / set / rest) -->
<div id="t" class="screen center">
  <div><div class="lbl" id="lbl"></div><div class="name" id="sub"></div></div>
  <div class="ring">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke="rgba(255,255,255,.08)"/><circle id="bar" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>
    <div class="num" id="num"></div>
  </div>
  <div class="ctl">
    <div id="ctrlW" class="row"><button class="btn main" id="done" style="flex:1;height:72px;font-size:22px">SET DONE</button></div>
    <div id="ctrlR" class="row" style="display:none">
      <button class="btn" id="m15">−15s</button>
      <button class="btn main" id="skip">SKIP</button>
      <button class="btn" id="p15">+15s</button>
    </div>
    <div id="ctrlC" class="row">
      <button class="btn" id="pause">PAUSE</button>
      <button class="btn" id="endW">END</button>
    </div>
    <div id="note" class="dim" style="display:none;font-size:12px">Screen may turn off: this page can't keep it awake over plain HTTP. Raise the display timeout or serve the page over HTTPS.</div>
  </div>
</div>

<!-- RECAP -->
<div id="c" class="screen">
  <h1>RECAP</h1>
  <p class="sub" id="cDate"></p>
  <div class="dim" style="text-align:center;margin-top:20px">Total workout time</div>
  <div class="clock" id="cTime"></div>
  <div style="flex:1"></div>
  <button class="big" id="addEx">ADD EXERCISE</button>
  <button class="btn w100" id="clear" style="flex:none">NEW WORKOUT</button>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var LIM = { sets: [1, 30, 1], dur: [5, 600, 5], rest: [5, 600, 5] };
  var READY = 5;
  var cfg = { sets: 4, dur: 40, rest: 90 };
  var sess = { t0: 0, t1: 0 };
  try { var a = JSON.parse(localStorage.getItem('sets2_cfg')); if (a && a.sets) cfg = a; } catch (e) {}
  try { var b = JSON.parse(localStorage.getItem('sets2_sess')); if (b && typeof b.t0 === 'number') sess = b; } catch (e) {}
  var run = null, timer = null, wl = null, ac = null;

  function save() {
    try {
      localStorage.setItem('sets2_cfg', JSON.stringify(cfg));
      localStorage.setItem('sets2_sess', JSON.stringify(sess));
    } catch (e) {}
  }
  function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function hms(s) {
    s = Math.round(s);
    return s >= 3600 ? Math.floor(s / 3600) + ':' + ('0' + Math.floor(s % 3600 / 60)).slice(-2) + ':' + ('0' + (s % 60)).slice(-2) : mmss(s);
  }
  function spoken(s) {
    var m = Math.floor(s / 60), r = s % 60, o = [];
    if (m) o.push(m + (m === 1 ? ' minute' : ' minutes'));
    if (r || !m) o.push(r + (r === 1 ? ' second' : ' seconds'));
    return o.join(' ');
  }
  function show(id) { ['s', 't', 'c'].forEach(function (x) { $(x).className = 'screen' + (x === 't' ? ' center' : '') + (x === id ? ' on' : ''); }); }
  function accent(c) { document.documentElement.style.setProperty('--accent', c); }

  /* ---------- sound / voice / vibration / wake lock ---------- */
  function audio() {
    if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f, d, at) {
    var x = audio(); if (!x) return;
    var t = x.currentTime + (at || 0), o = x.createOscillator(), g = x.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.8, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(x.destination); o.start(t); o.stop(t + d + 0.02);
  }
  function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  var voiceOn = true;
  try { voiceOn = localStorage.getItem('wk_voice') !== '0'; } catch (e) {}
  function say(t, delay) {
    if (!voiceOn || !window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 1.05;
      setTimeout(function () { speechSynthesis.speak(u); }, delay || 0);
    } catch (e) {}
  }
  function drawVoice() { $('voice').textContent = voiceOn ? 'ON' : 'OFF'; }
  $('voice').onclick = function () {
    voiceOn = !voiceOn; drawVoice();
    try { localStorage.setItem('wk_voice', voiceOn ? '1' : '0'); } catch (e) {}
    if (voiceOn) say('Voice on');
  };

  function lock() {
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').then(function (l) {
        wl = l; l.addEventListener('release', function () { wl = null; });
      }).catch(function () { $('note').style.display = 'block'; });
    } else { $('note').style.display = 'block'; }
  }
  function unlock() { if (wl) { try { wl.release(); } catch (e) {} wl = null; } }
  document.addEventListener('visibilitychange', function () {
    if (run && document.visibilityState === 'visible' && !wl) lock();
  });

  /* ---------- setup ---------- */
  function drawSetup() {
    $('v-sets').textContent = cfg.sets;
    $('v-dur').textContent = mmss(cfg.dur);
    $('v-rest').textContent = mmss(cfg.rest);
    $('total').textContent = 'Up to ' + hms(cfg.sets * cfg.dur + (cfg.sets - 1) * cfg.rest) + ' in total';
    $('seeRecap').style.display = sess.t0 ? 'block' : 'none';
  }
  document.querySelectorAll('[data-k]').forEach(function (btn) {
    btn.onclick = function () {
      var k = btn.getAttribute('data-k'), l = LIM[k], d = +btn.getAttribute('data-d');
      cfg[k] = Math.min(l[1], Math.max(l[0], cfg[k] + d * l[2])); drawSetup();
    };
  });

  /* ---------- workout: ready -> (set -> rest)* ---------- */
  function setSub(t) { run.subTxt = t; $('sub').textContent = run.paused ? 'PAUSED' : t; }
  function phase(p, len, label, sub) {
    run.phase = p; run.t0 = performance.now(); run.len = len; run.sec = -1;
    run.paused = false; $('pause').textContent = 'PAUSE';
    $('lbl').textContent = label; setSub(sub);
    $('ctrlW').style.display = p === 'work' ? 'flex' : 'none';
    $('ctrlR').style.display = p === 'rest' ? 'flex' : 'none';
    show('t'); tick();
  }
  function start() {
    audio();
    run = { sets: cfg.sets, dur: cfg.dur, rest: cfg.rest, cur: 1, phase: 'ready', t0: 0, len: READY, sec: -1, paused: false, pAt: 0, subTxt: '' };
    if (!sess.t0) sess.t0 = Date.now();
    sess.t1 = Date.now(); save();
    $('note').style.display = 'none';
    phase('ready', READY, 'GET READY', 'Starting soon');
    say('Get ready');
    lock();
    clearInterval(timer); timer = setInterval(tick, 100);
  }
  function beginSet() {
    var half = Math.floor(run.sets / 2), msg = 'Set ' + run.cur + ' of ' + run.sets;
    if (run.cur === run.sets && run.sets > 1) msg = 'Last set';
    else if (run.sets >= 4 && run.cur === half + 1) msg += ', halfway';
    phase('work', run.dur, 'SET ' + run.cur + ' / ' + run.sets, 'GO!');
    tone(1320, 0.6); vib(400); say(msg, 700);
  }
  function beginRest() {
    phase('rest', run.rest, 'REST', 'Next: set ' + (run.cur + 1) + ' / ' + run.sets);
    vib(60); say('Rest, ' + spoken(run.rest), 200);
  }
  function endSet() {
    if (run.cur >= run.sets) { finish(true); return; }
    beginRest();
  }
  function endRest() { run.cur++; beginSet(); }

  function tick() {
    if (!run || run.paused) return;
    var left = run.len * 1000 - (performance.now() - run.t0);
    if (left <= 0) {
      if (run.phase === 'ready') beginSet();
      else if (run.phase === 'work') endSet();
      else endRest();
      return;
    }
    var sec = Math.ceil(left / 1000);
    if (sec !== run.sec) {
      if (run.sec !== -1 && sec >= 1 && sec <= 3) { tone(880, 0.15); vib(40); }
      run.sec = sec;
    }
    var warn = run.len > 20 ? 10 : 3, low = sec <= warn;
    accent(run.phase === 'ready' ? '#4FC3F7' : run.phase === 'rest' ? (low ? '#FFB300' : '#4FC3F7') : (low ? '#FFB300' : '#3DDC84'));
    $('num').textContent = sec >= 60 ? mmss(sec) : sec;
    $('bar').style.strokeDashoffset = (276.46 * (1 - left / (run.len * 1000))).toFixed(2);
    document.title = (run.phase === 'work' ? 'Set ' + run.cur + ' ' : run.phase === 'rest' ? 'Rest ' : 'Ready ') + mmss(sec);
  }

  function togglePause() {
    if (!run) return;
    var now = performance.now();
    if (run.paused) {
      run.t0 += now - run.pAt; run.paused = false;
      $('pause').textContent = 'PAUSE'; $('sub').textContent = run.subTxt; tick();
    } else {
      run.pAt = now; run.paused = true;
      $('pause').textContent = 'RESUME'; $('sub').textContent = 'PAUSED'; accent('#6B7380');
      try { speechSynthesis.cancel(); } catch (e) {}
    }
  }

  function finish(complete) {
    clearInterval(timer); unlock(); run = null;
    sess.t1 = Date.now(); save();
    document.title = 'Sets Timer'; accent('#3DDC84');
    drawRecap(); show('c');
    if (complete) {
      tone(1320, 0.3, 0); tone(1320, 0.3, 0.45); tone(1320, 0.3, 0.9);
      vib([300, 150, 300, 150, 600]); say('Workout complete', 1500);
    } else { try { speechSynthesis.cancel(); } catch (e) {} }
  }

  $('start').onclick = start;
  $('done').onclick = function () { if (run && run.phase === 'work') endSet(); };
  $('skip').onclick = function () { if (run && run.phase === 'rest') endRest(); };
  $('m15').onclick = function () { if (run) { run.len = Math.max(5, run.len - 15); tick(); } };
  $('p15').onclick = function () { if (run) { run.len += 15; tick(); } };
  $('pause').onclick = togglePause;
  $('endW').onclick = function () { if (confirm('End the workout now?')) finish(false); };
  $('seeRecap').onclick = function () { drawRecap(); show('c'); };

  /* ---------- recap ---------- */
  function drawRecap() {
    $('cDate').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    $('cTime').textContent = hms((sess.t1 - sess.t0) / 1000);
  }
  $('addEx').onclick = function () { drawSetup(); show('s'); };
  $('clear').onclick = function () {
    if (confirm('Clear the workout time and start a new workout?')) {
      sess = { t0: 0, t1: 0 }; save(); drawSetup(); show('s');
    }
  };

  drawSetup(); drawVoice();
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
</script>
</body>
</html>
