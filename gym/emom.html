<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>EMOM Timer</title>
<style>
:root{--bg:#0E1116;--panel:#181D25;--btn:#262D38;--dim:#8A94A3;--green:#3DDC84;--amber:#FFB300;--blue:#4FC3F7;--gray:#6B7380;--accent:#3DDC84}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
.screen{display:none;min-height:100%;max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));flex-direction:column;gap:14px}
.screen.on{display:flex}
h1{margin:0;font-size:44px;font-weight:900;color:var(--green);letter-spacing:1px}
.sub{color:var(--dim);margin:-8px 0 8px}
.row{display:flex;align-items:center;gap:8px}
.presets button{flex:1;padding:12px 0;background:none;border:1px solid #3a4452;color:#fff;border-radius:12px;font-size:15px}
.step{background:var(--panel);border-radius:18px;padding:12px 16px}
.step span.l{flex:1;color:var(--dim);font-size:17px}
.step b{width:92px;text-align:center;font-size:28px}
.rb{width:48px;height:48px;border-radius:50%;border:0;background:var(--btn);color:#fff;font-size:26px}
.total{text-align:center;color:var(--dim);font-size:16px}
.big{height:72px;border:0;border-radius:20px;background:var(--green);color:var(--bg);font-size:24px;font-weight:700}
.btn{flex:1;height:64px;border-radius:18px;border:1px solid #3a4452;background:none;color:#fff;font-size:18px}
.btn.main{flex:1.4;border:0;background:var(--accent);color:var(--bg);font-weight:700}
#t{justify-content:space-between;align-items:center;text-align:center}
#lbl{font-size:24px;font-weight:700;color:var(--accent)}
.ring{position:relative;width:min(85vw,420px,52vh);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
#bar{stroke:var(--accent);stroke-linecap:round;transition:stroke .2s}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(64px,24vw,120px);font-weight:900;font-variant-numeric:tabular-nums}
#tot{color:var(--dim);font-size:18px}
#paused{color:var(--amber);font-weight:700;height:22px}
#note{display:none;color:var(--dim);font-size:12px;max-width:340px}
#ctrl{width:100%}
#unlock{display:none;width:100%;height:64px;border-radius:18px;background:var(--panel);color:var(--dim);font-size:18px;align-items:center;justify-content:center}
.back{color:var(--dim);text-decoration:none;font-size:15px}
.vbtn{width:auto;padding:0 20px;border-radius:24px;font-size:16px;font-weight:700}
#d{justify-content:center;align-items:center;text-align:center}
#d h1{font-size:72px}
</style>
</head>
<body>

<div id="s" class="screen on">
  <a class="back" href="index.html">← Menu</a>
  <h1>EMOM</h1>
  <p class="sub">Every Minute On the Minute</p>
  <div class="row presets">
    <button data-p="10">10 min</button><button data-p="15">15 min</button>
    <button data-p="20">20 min</button><button data-p="30">30 min</button>
  </div>
  <div class="row step"><span class="l">Interval</span><button class="rb" data-k="iv" data-d="-1">−</button><b id="v-iv"></b><button class="rb" data-k="iv" data-d="1">+</button></div>
  <div class="row step"><span class="l">Rounds</span><button class="rb" data-k="rounds" data-d="-1">−</button><b id="v-rounds"></b><button class="rb" data-k="rounds" data-d="1">+</button></div>
  <div class="row step"><span class="l">Warm-up</span><button class="rb" data-k="warm" data-d="-1">−</button><b id="v-warm"></b><button class="rb" data-k="warm" data-d="1">+</button></div>
  <div class="row step"><span class="l">Voice</span><button class="rb vbtn" id="voice"></button></div>
  <div class="total" id="total"></div>
  <button class="big" id="start">START</button>
</div>

<div id="t" class="screen">
  <div id="lbl"></div>
  <div class="ring">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke="rgba(255,255,255,.08)"/><circle id="bar" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>
    <div class="num" id="num"></div>
  </div>
  <div><div id="tot"></div><div id="paused"></div></div>
  <div id="note">Screen may turn off: this page can't keep it awake over plain HTTP. Raise the display timeout or serve the page over HTTPS.</div>
  <div id="ctrl" class="row">
    <button class="btn main" id="pause">PAUSE</button>
    <button class="btn" id="stop">STOP</button>
    <button class="btn" id="lock">LOCK</button>
  </div>
  <div id="unlock">Hold to unlock</div>
</div>

<div id="d" class="screen">
  <h1>DONE</h1>
  <p class="sub" id="sum"></p>
  <button class="big" id="back" style="width:100%;margin-top:30px">BACK</button>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var LIM = { iv: [10, 600, 5], rounds: [1, 99, 1], warm: [0, 60, 5] };
  var cfg = { iv: 60, rounds: 10, warm: 10 };
  try { var sv = JSON.parse(localStorage.getItem('emom')); if (sv && sv.iv) cfg = sv; } catch (e) {}

  var run = { on: false, paused: false, acc: 0, t0: 0, seg: -1, sec: -1 };
  var timer = null, wl = null, ac = null;

  function mmss(s) { return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function show(id) {
    ['s', 't', 'd'].forEach(function (x) { $(x).className = 'screen' + (x === id ? ' on' : ''); });
  }

  /* ---------- setup ---------- */
  function drawSetup() {
    $('v-iv').textContent = mmss(cfg.iv);
    $('v-rounds').textContent = cfg.rounds;
    $('v-warm').textContent = cfg.warm + 's';
    $('total').textContent = 'Total workout  ' + mmss(cfg.iv * cfg.rounds);
  }
  document.querySelectorAll('[data-k]').forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-k'), l = LIM[k], d = +b.getAttribute('data-d');
      cfg[k] = Math.min(l[1], Math.max(l[0], cfg[k] + d * l[2]));
      drawSetup();
    };
  });
  document.querySelectorAll('[data-p]').forEach(function (b) {
    b.onclick = function () { cfg.iv = 60; cfg.rounds = +b.getAttribute('data-p'); drawSetup(); };
  });

  /* ---------- sound / vibration / wake lock ---------- */
  function audio() {
    if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f, d, at) {
    var a = audio(); if (!a) return;
    var t = a.currentTime + (at || 0), o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.8, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + d + 0.02);
  }
  function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  /* ---------- voice ---------- */
  var voiceOn = true;
  try { voiceOn = localStorage.getItem('wk_voice') !== '0'; } catch (e) {}
  function say(t, delay) {
    if (!voiceOn || !window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 1.05;
      setTimeout(function () { speechSynthesis.speak(u); }, delay || 0);
    } catch (e) {}
  }
  function drawVoice() { $('voice').textContent = voiceOn ? 'ON' : 'OFF'; }
  $('voice').onclick = function () {
    voiceOn = !voiceOn; drawVoice();
    try { localStorage.setItem('wk_voice', voiceOn ? '1' : '0'); } catch (e) {}
    if (voiceOn) say('Voice on');
  };
  function tick3() { tone(880, 0.15); vib(40); }
  function go() { tone(1320, 0.6); vib(400); }
  function fin() { tone(1320, 0.3, 0); tone(1320, 0.3, 0.45); tone(1320, 0.3, 0.9); vib([300, 150, 300, 150, 600]); }

  function lock() {
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').then(function (l) {
        wl = l; l.addEventListener('release', function () { wl = null; });
      }).catch(function () { $('note').style.display = 'block'; });
    } else { $('note').style.display = 'block'; }
  }
  function unlock() { if (wl) { try { wl.release(); } catch (e) {} wl = null; } }
  document.addEventListener('visibilitychange', function () {
    if (run.on && document.visibilityState === 'visible' && !wl) lock();
  });

  /* ---------- timer ---------- */
  function elapsed() { return run.paused ? run.acc : run.acc + performance.now() - run.t0; }

  function tick() {
    var warm = cfg.warm * 1000, iv = cfg.iv * 1000, total = warm + iv * cfg.rounds, e = elapsed();
    if (e >= total) { finish(); return; }
    var inWarm = e < warm, left, tot, round = 0;
    if (inWarm) { left = warm - e; tot = warm; }
    else { var x = e - warm; round = Math.floor(x / iv) + 1; left = iv - x % iv; tot = iv; }
    var sec = Math.ceil(left / 1000), seg = inWarm ? 0 : round;

    if (!run.paused) {
      if (seg !== run.seg) {
        run.seg = seg; run.sec = sec;
        if (seg >= 1) {
          go();
          var half = Math.floor(cfg.rounds / 2), msg = 'Round ' + seg;
          if (seg === cfg.rounds && cfg.rounds > 1) msg = 'Last round';
          else if (cfg.rounds >= 4 && seg === half + 1) msg += ', halfway';
          say(msg, 700);
        }
      }
      else if (sec !== run.sec) { run.sec = sec; if (sec >= 1 && sec <= 3) tick3(); }
    }

    var warn = cfg.iv > 20 ? 10 : 3;
    var col = run.paused ? 'var(--gray)' : inWarm ? 'var(--blue)' : sec <= warn ? 'var(--amber)' : 'var(--green)';
    document.documentElement.style.setProperty('--accent', col);
    $('lbl').textContent = inWarm ? 'GET READY' : 'ROUND ' + round + ' / ' + cfg.rounds;
    $('num').textContent = sec >= 60 ? mmss(sec) : sec;
    $('bar').style.strokeDashoffset = (276.46 * (1 - left / tot)).toFixed(2);
    $('tot').textContent = 'Total remaining  ' + mmss(Math.ceil((total - e) / 1000));
    $('paused').textContent = run.paused ? 'PAUSED' : '';
    document.title = (inWarm ? 'Get ready ' : 'R' + round + '/' + cfg.rounds + ' ') + mmss(sec);
  }

  function begin() {
    try { localStorage.setItem('emom', JSON.stringify(cfg)); } catch (e) {}
    audio(); // unlock audio on user gesture
    run = { on: true, paused: false, acc: 0, t0: performance.now(), seg: -1, sec: -1 };
    $('note').style.display = 'none';
    setLocked(false);
    show('t'); lock(); tick();
    if (cfg.warm > 0) say('Get ready');
    clearInterval(timer); timer = setInterval(tick, 100);
  }
  function end() {
    run.on = false; clearInterval(timer); unlock();
    document.title = 'EMOM Timer';
    document.documentElement.style.setProperty('--accent', '#3DDC84');
  }
  function finish() {
    end(); fin(); say('Workout complete', 1500);
    $('sum').textContent = cfg.rounds + ' rounds · ' + mmss(cfg.iv * cfg.rounds);
    show('d');
  }

  $('start').onclick = begin;
  $('back').onclick = function () { show('s'); };
  $('pause').onclick = function () {
    if (run.paused) { run.t0 = performance.now(); run.paused = false; $('pause').textContent = 'PAUSE'; }
    else { run.acc += performance.now() - run.t0; run.paused = true; $('pause').textContent = 'RESUME'; }
    tick();
  };
  $('stop').onclick = function () { if (confirm('Stop the workout?')) { end(); try { speechSynthesis.cancel(); } catch (e) {} show('s'); } };

  /* ---------- lock buttons (hold 0.7 s to unlock) ---------- */
  function setLocked(v) {
    $('ctrl').style.display = v ? 'none' : 'flex';
    $('unlock').style.display = v ? 'flex' : 'none';
  }
  $('lock').onclick = function () { setLocked(true); };
  var ut = null, un = $('unlock');
  function startHold() { ut = setTimeout(function () { setLocked(false); }, 700); }
  function cancelHold() { clearTimeout(ut); }
  un.addEventListener('touchstart', startHold, { passive: true });
  un.addEventListener('touchend', cancelHold);
  un.addEventListener('touchcancel', cancelHold);
  un.addEventListener('mousedown', startHold);
  un.addEventListener('mouseup', cancelHold);
  un.addEventListener('mouseleave', cancelHold);
  un.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  drawSetup(); drawVoice();
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
</script>
</body>
</html>
