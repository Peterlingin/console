<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AMRAP / For Time</title>
<style>
:root{--bg:#0E1116;--panel:#181D25;--btn:#262D38;--dim:#8A94A3;--green:#3DDC84;--amber:#FFB300;--blue:#4FC3F7;--accent:#3DDC84}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
.screen{display:none;min-height:100%;max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));flex-direction:column;gap:14px}
.screen.on{display:flex}
h1{margin:0;font-size:44px;font-weight:900;color:var(--green);letter-spacing:1px}
.sub{color:var(--dim);margin:-8px 0 8px}
.back{color:var(--dim);text-decoration:none;font-size:15px}
.row{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--panel);border-radius:16px;padding:4px}
.seg button{flex:1;height:46px;border:0;border-radius:12px;background:none;color:var(--dim);font-size:16px;font-weight:700}
.seg button.on{background:var(--green);color:var(--bg)}
.step{background:var(--panel);border-radius:18px;padding:12px 16px}
.step span.l{flex:1;color:var(--dim);font-size:17px}
.step b{width:92px;text-align:center;font-size:28px}
.rb{width:48px;height:48px;border-radius:50%;border:0;background:var(--btn);color:#fff;font-size:26px}
.vbtn{width:auto;padding:0 20px;border-radius:24px;font-size:16px;font-weight:700}
.total{text-align:center;color:var(--dim);font-size:16px}
.big{height:72px;border:0;border-radius:20px;background:var(--green);color:var(--bg);font-size:24px;font-weight:700;width:100%}
.btn{flex:1;height:60px;border-radius:18px;border:1px solid #3a4452;background:none;color:#fff;font-size:17px}
.lbl{font-size:22px;font-weight:700;color:var(--accent)}
.dim{color:var(--dim);font-size:16px}
.clock{font-size:clamp(64px,24vw,120px);font-weight:900;font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.pbar{height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:background .2s}
.tap{flex:1;min-height:200px;border:0;border-radius:28px;background:var(--accent);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:clamp(90px,34vw,190px);line-height:1;transition:transform .05s}
.tap:active{transform:scale(.98)}
.tap small{font-size:15px;font-weight:700;letter-spacing:1px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--panel);border-radius:16px;padding:12px 8px;text-align:center}
.tile b{display:block;font-size:22px;color:var(--green)}
.tile span{color:var(--dim);font-size:12px}
.laps{background:var(--panel);border-radius:18px;padding:10px 16px;max-height:34vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{color:var(--dim);font-weight:500;font-size:13px;text-align:right;padding:4px 0}
td{padding:6px 0;text-align:right;font-size:17px;border-top:1px solid #222a35}
th:first-child,td:first-child{text-align:left;color:var(--dim)}
.fast{color:var(--green)}.slow{color:var(--amber)}
</style>
</head>
<body>

<!-- SETUP -->
<div id="s" class="screen on">
  <a class="back" href="index.html">← Menu</a>
  <h1>AMRAP</h1>
  <p class="sub">Rounds against the clock, or fastest time</p>
  <div class="seg"><button data-m="amrap">AMRAP</button><button data-m="ft">FOR TIME</button></div>
  <div class="row step" id="rowT"><span class="l">Time</span><button class="rb" data-k="time" data-d="-1">−</button><b id="v-time"></b><button class="rb" data-k="time" data-d="1">+</button></div>
  <div class="row step" id="rowR"><span class="l">Rounds</span><button class="rb" data-k="rounds" data-d="-1">−</button><b id="v-rounds"></b><button class="rb" data-k="rounds" data-d="1">+</button></div>
  <div class="row step" id="rowC"><span class="l">Time cap</span><button class="rb" data-k="cap" data-d="-1">−</button><b id="v-cap"></b><button class="rb" data-k="cap" data-d="1">+</button></div>
  <div class="row step"><span class="l">Voice</span><button class="rb vbtn" id="voice"></button></div>
  <div class="total" id="total"></div>
  <button class="big" id="start">START</button>
</div>

<!-- TIMER -->
<div id="t" class="screen">
  <div class="row" style="justify-content:space-between"><div class="lbl" id="lbl"></div><div class="dim" id="sub2"></div></div>
  <div class="clock" id="clock"></div>
  <div class="pbar"><i id="pfill"></i></div>
  <button class="tap" id="tap"><span id="cnt">0</span><small>TAP = ROUND DONE</small></button>
  <div class="dim" id="lapline" style="text-align:center;min-height:20px"></div>
  <div class="row"><button class="btn" id="undo">UNDO</button><button class="btn" id="pause">PAUSE</button><button class="btn" id="end">END</button></div>
  <div id="note" class="dim" style="display:none;font-size:12px">Screen may turn off: this page can't keep it awake over plain HTTP. Raise the display timeout or serve the page over HTTPS.</div>
</div>

<!-- RECAP -->
<div id="c" class="screen">
  <h1 id="cTitle"></h1>
  <p class="sub" id="cSub"></p>
  <div class="clock" id="cMain" style="font-size:clamp(40px,15vw,76px);color:var(--green)"></div>
  <div class="row step" id="extraRow"><span class="l">Extra reps</span><button class="rb" id="xm">−</button><b id="xv">0</b><button class="rb" id="xp">+</button></div>
  <div class="tiles" id="tiles"></div>
  <div class="laps" id="lapbox"></div>
  <button class="big" id="again">AGAIN</button>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var LIM = { time: [1, 60, 1], rounds: [1, 99, 1], cap: [0, 60, 1] };
  var cfg = { mode: 'amrap', time: 12, rounds: 5, cap: 0 };
  try { var a = JSON.parse(localStorage.getItem('amrap_cfg')); if (a && a.mode) cfg = a; } catch (e) {}
  var run = null, res = null, timer = null, wl = null, ac = null;

  function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function show(id) { ['s', 't', 'c'].forEach(function (x) { $(x).className = 'screen' + (x === id ? ' on' : ''); }); }
  function accent(c) { document.documentElement.style.setProperty('--accent', c); }

  /* ---------- sound / voice / vibration / wake lock ---------- */
  function audio() {
    if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f, d, at) {
    var x = audio(); if (!x) return;
    var t = x.currentTime + (at || 0), o = x.createOscillator(), g = x.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.8, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(x.destination); o.start(t); o.stop(t + d + 0.02);
  }
  function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  var voiceOn = true;
  try { voiceOn = localStorage.getItem('wk_voice') !== '0'; } catch (e) {}
  function say(t, delay) {
    if (!voiceOn || !window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 1.05;
      setTimeout(function () { speechSynthesis.speak(u); }, delay || 0);
    } catch (e) {}
  }
  function drawVoice() { $('voice').textContent = voiceOn ? 'ON' : 'OFF'; }
  $('voice').onclick = function () {
    voiceOn = !voiceOn; drawVoice();
    try { localStorage.setItem('wk_voice', voiceOn ? '1' : '0'); } catch (e) {}
    if (voiceOn) say('Voice on');
  };
  function lock() {
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').then(function (l) {
        wl = l; l.addEventListener('release', function () { wl = null; });
      }).catch(function () { $('note').style.display = 'block'; });
    } else { $('note').style.display = 'block'; }
  }
  function unlock() { if (wl) { try { wl.release(); } catch (e) {} wl = null; } }
  document.addEventListener('visibilitychange', function () {
    if (run && document.visibilityState === 'visible' && !wl) lock();
  });

  /* ---------- setup ---------- */
  function drawSetup() {
    var am = cfg.mode === 'amrap';
    document.querySelectorAll('.seg button').forEach(function (b) { b.className = b.getAttribute('data-m') === cfg.mode ? 'on' : ''; });
    $('rowT').style.display = am ? 'flex' : 'none';
    $('rowR').style.display = $('rowC').style.display = am ? 'none' : 'flex';
    $('v-time').textContent = cfg.time + ' min';
    $('v-rounds').textContent = cfg.rounds;
    $('v-cap').textContent = cfg.cap ? cfg.cap + ' min' : 'None';
    $('total').textContent = am ? 'Score: rounds completed in ' + cfg.time + ' min'
      : 'Score: time to finish ' + cfg.rounds + ' rounds' + (cfg.cap ? ' (cap ' + cfg.cap + ' min)' : '');
  }
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.onclick = function () { cfg.mode = b.getAttribute('data-m'); drawSetup(); };
  });
  document.querySelectorAll('[data-k]').forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-k'), l = LIM[k], d = +b.getAttribute('data-d');
      cfg[k] = Math.min(l[1], Math.max(l[0], cfg[k] + d * l[2])); drawSetup();
    };
  });

  /* ---------- run ---------- */
  function start() {
    audio();
    try { localStorage.setItem('amrap_cfg', JSON.stringify(cfg)); } catch (e) {}
    var am = cfg.mode === 'amrap';
    run = { mode: cfg.mode, cap: (am ? cfg.time : cfg.cap) * 60, target: cfg.rounds, phase: 'ready', t0: performance.now(),
            laps: [], count: 0, paused: false, pAt: 0, cue: {}, sec: -1 };
    $('note').style.display = 'none'; $('pause').textContent = 'PAUSE';
    $('lbl').textContent = 'GET READY'; $('sub2').textContent = am ? 'AMRAP ' + cfg.time + ' min' : 'FOR TIME · ' + cfg.rounds + ' rounds';
    $('cnt').textContent = '0'; $('lapline').textContent = ''; $('pfill').style.width = '0';
    accent('#4FC3F7'); show('t'); lock(); say('Get ready');
    clearInterval(timer); timer = setInterval(tick, 100); tick();
  }
  function begin() {
    run.phase = 'run'; run.t0 = performance.now(); run.sec = -1;
    $('lbl').textContent = run.mode === 'amrap' ? 'GO!' : 'GO!';
    accent('#3DDC84'); tone(1320, 0.6); vib(400); say('Go', 100);
  }
  function tick() {
    if (!run || run.paused) return;
    var now = performance.now(), el = now - run.t0, sec;
    if (run.phase === 'ready') {
      var l0 = 5000 - el;
      if (l0 <= 0) { begin(); return; }
      sec = Math.ceil(l0 / 1000);
      if (sec !== run.sec) { if (run.sec !== -1 && sec <= 3) { tone(880, 0.15); vib(40); } run.sec = sec; }
      $('clock').textContent = sec; return;
    }
    var capMs = run.cap * 1000, left = capMs - el;
    if (run.cap && left <= 0) { finish(run.mode === 'amrap' ? 'time' : 'cap'); return; }
    if (run.cap) {
      sec = Math.ceil(left / 1000);
      if (sec !== run.sec) {
        if (run.sec !== -1 && sec >= 1 && sec <= 3) { tone(880, 0.15); vib(40); }
        run.sec = sec;
        var c = run.cue;
        if (sec === 60 && run.cap >= 120 && !c.m1) { c.m1 = 1; say('One minute left', 0); }
        else if (sec === 30 && run.cap >= 60 && !c.s30) { c.s30 = 1; say('30 seconds', 0); }
        else if (sec === 10 && run.cap >= 30 && !c.s10) { c.s10 = 1; say('Ten seconds', 0); }
      }
      if (!c || !run.cue.half) { if (run.cap >= 240 && el >= capMs / 2) { run.cue.half = 1; say('Halfway', 0); } }
      accent(sec <= 10 ? '#FFB300' : '#3DDC84');
    }
    if (run.mode === 'amrap') {
      $('clock').textContent = mmss(Math.ceil(left / 1000));
      $('pfill').style.width = Math.min(100, el / capMs * 100) + '%';
    } else {
      $('clock').textContent = mmss(Math.floor(el / 1000));
      $('pfill').style.width = Math.min(100, run.count / run.target * 100) + '%';
    }
    document.title = $('clock').textContent + ' · ' + run.count;
  }
  function lapLine() {
    var L = run.laps;
    if (!L.length) { $('lapline').textContent = ''; return; }
    var d = L.map(function (t, i) { return t - (i ? L[i - 1] : 0); });
    $('lapline').textContent = 'Last ' + mmss(d[d.length - 1] / 1000) + ' · Best ' + mmss(Math.min.apply(null, d) / 1000);
  }
  $('tap').onclick = function () {
    if (!run || run.phase !== 'run' || run.paused) return;
    run.laps.push(performance.now() - run.t0); run.count++;
    $('cnt').textContent = run.count; lapLine(); tone(1000, 0.08); vib(30);
    if (run.mode === 'ft' && run.count >= run.target) { finish('done'); return; }
    say('Round ' + run.count);
    tick();
  };
  $('undo').onclick = function () {
    if (!run || run.phase !== 'run' || !run.laps.length) return;
    run.laps.pop(); run.count--; $('cnt').textContent = run.count; lapLine(); tick();
  };
  $('pause').onclick = function () {
    if (!run) return;
    var now = performance.now();
    if (run.paused) { run.t0 += now - run.pAt; run.paused = false; $('pause').textContent = 'PAUSE'; tick(); }
    else { run.pAt = now; run.paused = true; $('pause').textContent = 'RESUME'; accent('#6B7380'); try { speechSynthesis.cancel(); } catch (e) {} }
  };
  $('end').onclick = function () { if (confirm('End the workout now?')) finish('stop'); };

  function finish(reason) {
    var now = performance.now(), el = run.phase === 'run' ? (run.paused ? run.pAt : now) - run.t0 : 0;
    clearInterval(timer); unlock();
    res = { mode: run.mode, reason: reason, count: run.count, laps: run.laps, el: el, cap: run.cap, target: run.target, extra: 0 };
    run = null; document.title = 'AMRAP / For Time'; accent('#3DDC84');
    drawRecap(); show('c');
    if (reason !== 'stop') {
      tone(1320, 0.3, 0); tone(1320, 0.3, 0.45); tone(1320, 0.3, 0.9); vib([300, 150, 300, 150, 600]);
      say(reason === 'done' ? 'Finished' : 'Time', 1500);
    } else { try { speechSynthesis.cancel(); } catch (e) {} }
  }

  /* ---------- recap ---------- */
  function drawRecap() {
    var r = res, am = r.mode === 'amrap', L = r.laps;
    $('cTitle').textContent = r.reason === 'done' ? 'FINISHED' : r.reason === 'cap' ? 'TIME CAP' : r.reason === 'time' ? "TIME!" : 'STOPPED';
    $('cSub').textContent = am ? 'AMRAP ' + Math.round(r.cap / 60) + ' min' : 'For Time · ' + r.target + ' rounds';
    $('extraRow').style.display = am ? 'flex' : 'none';
    $('xv').textContent = r.extra;
    var main = am ? r.count + (r.count === 1 ? ' round' : ' rounds') + (r.extra ? ' + ' + r.extra + ' reps' : '')
      : r.reason === 'done' ? mmss(r.el / 1000) : r.count + ' / ' + r.target + ' rounds · ' + mmss(r.el / 1000);
    $('cMain').textContent = main;
    var d = L.map(function (t, i) { return t - (i ? L[i - 1] : 0); });
    var tiles = $('tiles'); tiles.innerHTML = '';
    if (d.length) {
      var avg = d.reduce(function (x, y) { return x + y; }, 0) / d.length;
      [['Average lap', avg], ['Fastest', Math.min.apply(null, d)], ['Slowest', Math.max.apply(null, d)]].forEach(function (x) {
        var t = document.createElement('div'); t.className = 'tile';
        t.innerHTML = '<b>' + mmss(x[1] / 1000) + '</b><span>' + x[0] + '</span>'; tiles.appendChild(t);
      });
    }
    var box = $('lapbox');
    if (!d.length) { box.innerHTML = '<div class="dim">No rounds logged.</div>'; return; }
    var mn = Math.min.apply(null, d), mx = Math.max.apply(null, d), h = '<table><tr><th>Round</th><th>Lap</th><th>Total</th></tr>';
    d.forEach(function (x, i) {
      var cl = d.length > 1 ? (x === mn ? 'fast' : x === mx ? 'slow' : '') : '';
      h += '<tr><td>' + (i + 1) + '</td><td class="' + cl + '">' + mmss(x / 1000) + '</td><td>' + mmss(L[i] / 1000) + '</td></tr>';
    });
    box.innerHTML = h + '</table>';
  }
  $('xm').onclick = function () { if (res.extra > 0) { res.extra--; drawRecap(); } };
  $('xp').onclick = function () { res.extra++; drawRecap(); };
  $('again').onclick = function () { drawSetup(); show('s'); };

  drawSetup(); drawVoice();
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
</script>
</body>
</html>
