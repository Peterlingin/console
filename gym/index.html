<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Workout Timers</title>
<style>
:root{--bg:#0E1116;--panel:#181D25;--dim:#8A94A3;--green:#3DDC84;--blue:#4FC3F7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
.screen{min-height:100%;max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;justify-content:center}
h1{margin:0;font-size:44px;font-weight:900;color:var(--green);letter-spacing:1px}
.sub{color:var(--dim);margin:-8px 0 14px}
.card{display:block;text-decoration:none;color:#fff;background:var(--panel);border-radius:22px;padding:22px 20px;border-left:6px solid var(--green)}
.card.b{border-left-color:var(--blue)}
.card b{display:block;font-size:26px;margin-bottom:4px}
.card span{color:var(--dim);font-size:15px}
.hint{color:var(--dim);font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="screen">
  <h1>TRAIN</h1>
  <p class="sub">Pick a timer</p>
  <a class="card" href="emom.html"><b>EMOM Timer</b><span>Every Minute On the Minute: intervals, rounds, warm-up</span></a>
  <a class="card b" href="sets.html"><b>Sets Timer</b><span>Sets with a time limit, rest between sets, total workout time</span></a>
  <div class="hint">Over HTTPS you can install this page from the browser menu ("Install app" / "Add to Home screen") and use it offline.</div>
</div>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
</script>
</body>
</html>
